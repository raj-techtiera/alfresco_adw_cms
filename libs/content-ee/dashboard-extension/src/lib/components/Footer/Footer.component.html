<footer class="acs-app-footer" role="contentinfo" aria-label="Site footer">
  <div class="acs-app-footer__inner">
    <p class="acs-app-footer__copyright">{{ copyrightText }}</p>
    <div class="acs-app-footer__powered">
      <span class="acs-app-footer__powered-label">Powered By</span>
      <img
        class="acs-app-footer__powered-logo"
        [src]="poweredByLogoUrl"
        alt="TechTiera"
        width="140"
        height="28"
        loading="lazy"
        decoding="async"
      />
    </div>
  </div>
</footer>
